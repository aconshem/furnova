<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us — FURNOVA</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="container" style="padding:48px 0;">
  <h1 class="serif" style="font-size:42px;">Contact Us</h1>

  <div class="contact-grid">
    <div class="contact-card">
      <h2 class="serif">Let's talk furniture</h2>
      <div class="contact-card-info" id="contact-info"></div>
    </div>
    <form class="contact-form" id="contact-form">
      <input type="text" placeholder="Name" required>
      <input type="email" placeholder="Email" required>
      <input type="tel" placeholder="Phone" required>
      <textarea placeholder="Message" required></textarea>
      <button type="submit" class="btn btn-dark">Send Message</button>
      <p class="contact-form-note" id="contact-note" hidden>Thanks — this demo form has recorded your submission locally. Connect it to a service later.</p>
    </form>
  </div>

  <div class="map-placeholder">
    <div>
      <p>Map Placeholder</p>
      <p>Replace with Google Maps when the business location is final.</p>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<div id="whatsapp-button"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/layout.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('contact-info').innerHTML = `
    <p><b>Phone</b><br>${SITE.phone}</p>
    <p><b>WhatsApp</b><br>${SITE.whatsappNumber}</p>
    <p><b>Email</b><br>${SITE.email}</p>
    <p><b>Location</b><br>${SITE.address}</p>
    <p><b>Opening hours</b><br>${SITE.openingHours}</p>
  `;
  document.getElementById('contact-form').addEventListener('submit', e => {
    e.preventDefault();
    document.getElementById('contact-note').hidden = false;
  });
});
</script>
</body>
</html>
