<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQ — FURNOVA</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="container" style="max-width:760px;padding:48px 20px;">
  <p class="eyebrow">Help</p>
  <h1 class="serif" style="font-size:42px;margin-top:10px;">Frequently Asked Questions</h1>
  <div class="faq-list" id="faq-list"></div>
</main>

<div id="site-footer"></div>
<div id="whatsapp-button"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/layout.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const list = document.getElementById('faq-list');
  list.innerHTML = FAQS.map(([q, a], i) => `
    <div class="faq-item" data-i="${i}">
      <button class="faq-q"><span>${q}</span><span class="faq-sign">+</span></button>
      <p class="faq-a">${a}</p>
    </div>
  `).join('');

  list.addEventListener('click', e => {
    const btn = e.target.closest('.faq-q');
    if (!btn) return;
    const item = btn.closest('.faq-item');
    const wasOpen = item.classList.contains('open');
    list.querySelectorAll('.faq-item').forEach(i => {
      i.classList.remove('open');
      i.querySelector('.faq-sign').textContent = '+';
    });
    if (!wasOpen) {
      item.classList.add('open');
      item.querySelector('.faq-sign').textContent = '−';
    }
  });
});
</script>
</body>
</html>
