<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Cart — FURNOVA</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="container" id="cart-main" style="padding:48px 0;">
  <!-- filled by cart.js -->
</main>

<div class="modal-overlay" id="details-modal">
  <div class="modal-box">
    <div class="modal-head">
      <h2 class="serif">Customer Details</h2>
      <button id="close-modal" aria-label="Close">✕</button>
    </div>
    <p class="hint">Your order will open in WhatsApp after you submit these details.</p>
    <form class="modal-form" id="details-form">
      <input type="text" id="cf-name" placeholder="Full Name" required>
      <input type="text" id="cf-phone" placeholder="Phone Number" required>
      <input type="text" id="cf-location" placeholder="Delivery Location" required>
      <textarea id="cf-notes" placeholder="Additional Notes"></textarea>
      <button type="submit" class="btn btn-whatsapp" id="modal-submit-btn">Open WhatsApp</button>
    </form>
  </div>
</div>

<div id="site-footer"></div>
<div id="whatsapp-button"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/product-card.js"></script>
<script src="assets/js/cart.js"></script>
</body>
</html>
